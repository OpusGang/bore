[build-system]
requires = [
    "hatchling>=1.27.0",
    "packaging",
    "meson",
    "ninja",
    "vapoursynth>=74",
]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-bore"
dynamic = ["version"]
description = "Border fixing"
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "noizuy", email = "daoko@protonmail.com" }]
maintainers = [
    { name = "noizuy", email = "daoko@protonmail.com" },
    { name = "quietvoid", email = "tcChlisop0@gmail.com" },
]
dependencies = ["vapoursynth>=74"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
"Source Code" = "https://github.com/OpusGang/bore"
"Bug Tracker" = "https://github.com/OpusGang/bore/issues"

[tool.hatch.version]
path = "meson.build"
pattern = "version\\s*:\\s*'(?P<version>[^']+)'"

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
    "vapoursynth/plugins/*.dylib",
    "vapoursynth/plugins/*.so",
    "vapoursynth/plugins/*.dll",
]

[tool.hatch.build.targets.sdist]
include = ["src", "meson.build", "meson_options.txt", "hatch_build.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.cibuildwheel]
build-frontend = { name = "build[uv]", args = ["--verbose"] }
build = "cp312-*"
skip = ["*-manylinux_i686", "*-musllinux_i686", "*-win32"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
repair-wheel-command = "auditwheel repair --strip -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-all = "brew install gsl"
environment.MACOSX_DEPLOYMENT_TARGET = "15.0"

[[tool.cibuildwheel.overrides]]
select = "*-manylinux*"
before-all = [
    "dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb",
    "dnf install -y cmake gcc-c++ gsl-devel git",
]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add --no-cache cmake g++ gsl-dev git"
